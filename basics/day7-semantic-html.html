<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Demo</title>
</head>
<body>

    <!-- Header: Top section of the page -->
    <header>
        <h1>My Website</h1>
        <p>Learning Semantic HTML</p>
    </header>

    <!-- Navigation bar -->
    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <!---- Main content area ---->
    <main>

        <!-- Section: Group of related content -->
        <section>
            <h2>About Me</h2>
            <p>I am learning HTML and building structured web pages.</p>
        </section>

        <!-- Article: Independent content -->
        <article>
            <h2>Blog Post</h2>
            <p>This is a blog post about Semantic HTML.</p>

            <!-- Aside: Related info -->
            <aside>
                <p><strong>Tip:</strong> Semantic tags improve SEO and readability.</p>
            </aside>
        </article>

    </main>

    <!-- Footer: Bottom section -->
    <footer>
        <p>&copy; 2026 My Website | All rights reserved</p>
    </footer>

</body>
</html>
